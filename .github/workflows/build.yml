name: Build GhostBlocker APK

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Show environment
        run: |
          java -version
          gradle --version
          echo "ANDROID_HOME=$ANDROID_HOME"

      - name: Build Release APK
        run: gradle --no-daemon clean assembleRelease

      - name: Show APK output
        shell: bash
        run: |
          echo "=== APK OUTPUT ==="
          find app/build/outputs -type f -name "*.apk" -print

      - name: Prepare APK
        shell: bash
        run: |
          mkdir -p release

          APK="app/build/outputs/apk/release/app-release.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK tidak ditemukan."
            exit 1
          fi

          cp "$APK" release/GhostBlocker.apk

          ls -lh release/GhostBlocker.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GhostBlocker
          path: release/GhostBlocker.apk
          if-no-files-found: error
          retention-days: 30
