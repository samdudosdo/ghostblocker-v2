name: Build GhostBlocker APK

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout source
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Java
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # 3. Android SDK
      # IMPORTANT:
      # Do NOT install the old "tools" package.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      # 4. Verify Android environment
      - name: Show Android environment
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          java -version
          adb version
          sdkmanager --version

      # 5. Make Gradle wrapper executable
      - name: Make Gradle executable
        shell: bash
        run: chmod +x ./gradlew

      # 6. Validate Gradle
      - name: Check Gradle
        run: ./gradlew --version

      # 7. Clean previous build
      - name: Clean
        run: ./gradlew --no-daemon clean

      # 8. Build release APK
      - name: Build Release APK
        run: ./gradlew --no-daemon assembleRelease

      # 9. Show generated files
      - name: List build output
        shell: bash
        run: |
          echo "=== APK OUTPUT ==="
          find app/build/outputs -type f -name "*.apk" -print

      # 10. Prepare release directory
      - name: Prepare APK
        shell: bash
        run: |
          mkdir -p release

          APK="app/build/outputs/apk/release/app-release.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: Release APK was not found!"
            exit 1
          fi

          cp "$APK" "release/GhostBlocker.apk"

          echo "APK prepared:"
          ls -lh release/GhostBlocker.apk

      # 11. Upload APK as GitHub Actions artifact
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GhostBlocker
          path: release/GhostBlocker.apk
          if-no-files-found: error
          retention-days: 30
